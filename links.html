<script>
(async () => {
  try {
    const posts = await sbGet("posts?select=slug,title,excerpt,cover_url,cover_alt,published_at" +
      "&status=eq.published&order=published_at.desc&limit=3");
    if (!posts.length) return;
    const [first, ...rest] = posts;
    // The newest post gets the big card; the rest are ordinary buttons.
    document.getElementById("lt-featured").innerHTML = `
      <a class="lt-feature" href="${postHref(first.slug)}">
        ${first.cover_url ? `<img src="${escapeHtml(first.cover_url)}" alt="${escapeHtml(first.cover_alt || "")}">` : ""}
        <span class="lt-feature-body">
          <span class="eyebrow">New &middot; ${escapeHtml(fmtDate(first.published_at))}</span>
          <span class="lt-title">${escapeHtml(first.title)}</span>
          ${first.excerpt ? `<span class="lt-excerpt">${escapeHtml(first.excerpt)}</span>` : ""}
          <span class="go">Read it &rarr;</span>
        </span></a>`;
    document.getElementById("lt-posts").innerHTML = rest.map((p) => `
      <a class="lt-link has-thumb" href="${postHref(p.slug)}">
        ${p.cover_url ? `<img class="lt-thumb" src="${escapeHtml(p.cover_url)}" alt="" loading="lazy">` : ""}
        <span class="lt-text"><span class="lt-title">${escapeHtml(p.title)}</span>
          <span class="lt-date">${escapeHtml(fmtDate(p.published_at))}</span></span></a>`).join("");
    document.getElementById("lt-latest").hidden = false;
  } catch (e) {
    console.error(e);   // the fixed links below still work
  }
})();

/* The phone's own share sheet where there is one; otherwise copy the link
   and say so on the button, rather than an alert that blocks the page. */
document.getElementById("lt-share").addEventListener("click", async (e) => {
  const btn = e.currentTarget;
  const url = "https://justamanda.net/links.html";
  if (navigator.share) {
    try { await navigator.share({ title: "just amanda", url }); } catch (err) { /* dismissed */ }
    return;
  }
  try {
    await navigator.clipboard.writeText(url);
    btn.classList.add("is-copied");
    btn.setAttribute("aria-label", "Link copied");
    setTimeout(() => { btn.classList.remove("is-copied"); btn.setAttribute("aria-label", "Share this page"); }, 1800);
  } catch (err) { /* clipboard blocked: nothing useful left to do */ }
});
</script>
