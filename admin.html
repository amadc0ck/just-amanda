<title>Write — just amanda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&family=Caveat:wght@500;600&display=swap" rel="stylesheet">

<style>
  .admin-bar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;}
  .admin-bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding-top:12px;padding-bottom:12px;flex-wrap:wrap;}
  .admin-bar h1{font-family:'Playfair Display',Georgia,serif;font-size:22px;font-weight:500;margin:0;}
  .admin-bar h1 span{font-family:'Inter',system-ui,sans-serif;font-size:11px;color:var(--ink-faint);
    letter-spacing:.5px;vertical-align:middle;margin-left:6px;}
  .admin-bar .actions{display:flex;gap:10px;flex-wrap:wrap;}
  .btn-sm{padding:9px 16px;font-size:11.5px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;letter-spacing:.6px;text-transform:uppercase;
    font-weight:600;color:var(--ink-faint);margin-bottom:6px;}
  .field input,.field textarea{width:100%;padding:11px 13px;border:1px solid var(--line);
    border-radius:9px;background:var(--card);color:var(--ink);font:inherit;font-size:15px;}
  .field textarea{min-height:420px;resize:vertical;line-height:1.6;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;}
  .field .hint{font-size:12.5px;color:var(--ink-faint);margin-top:5px;}
  .editor-cols{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start;}
  .preview{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);
    padding:22px 24px;min-height:420px;overflow-x:auto;}
  .row-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .plist{display:grid;gap:10px;}
  .prow{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);
    border-radius:11px;padding:13px 16px;}
  .prow .t{flex:1;min-width:0;}
  .prow .t b{font-family:'Playfair Display',Georgia,serif;font-weight:500;font-size:17px;display:block;}
  .prow .t span{font-size:12.5px;color:var(--ink-faint);}
  .pill{font-size:11px;letter-spacing:.8px;text-transform:uppercase;font-weight:600;
    padding:4px 10px;border-radius:20px;}
  .pill.draft{background:rgba(200,100,74,.12);color:var(--terracotta-dim);}
  .pill.published{background:rgba(167,184,151,.28);color:#4A5A3E;}
  .msg{padding:12px 16px;border-radius:10px;margin-bottom:16px;font-size:14.5px;}
  .msg.err{background:rgba(200,100,74,.12);color:var(--terracotta-dim);}
  .msg.ok{background:rgba(167,184,151,.28);color:#4A5A3E;}
  .cover-prev{max-height:130px;border-radius:10px;margin-top:10px;}
  .igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;}
  .icard{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px;}
  .icard img{width:100%;height:110px;object-fit:cover;border-radius:7px;background:var(--bg-wash);}
  .iname{font-size:11.5px;word-break:break-all;margin-top:8px;line-height:1.35;}
  .imeta{font-size:11.5px;color:var(--ink-faint);margin-top:2px;}
  .iacts{display:flex;gap:6px;margin-top:8px;}
  .iacts .btn{padding:6px 10px;font-size:10.5px;}
  @media (max-width:900px){ .editor-cols,.row-2{grid-template-columns:1fr;} .preview{min-height:0;} }
</style>

<body>

<div class="admin-bar">
  <div class="wrap">
    <h1>just amanda &middot; write <span id="build"></span></h1>
    <div class="actions" id="bar-actions"></div>
  </div>
</div>

<section><div class="wrap" id="app"><p class="muted">Loading&hellip;</p></div></section>

<script src="site.js?v=2026-09-03.17"></script>
<script src="markdown.js?v=2026-09-03.17"></script>
<script>
/* Bumped on every deploy, and shown in the admin bar. Browsers cache this page
   aggressively, and a stale tab silently running old code has already cost one
   batch of images their transparency. If the stamp on screen is not the newest,
   hard-refresh before uploading anything. */
const BUILD = "2026-09-03.17";

const KEY = "ja_auth";
const app = document.getElementById("app");
const barActions = document.getElementById("bar-actions");
let posts = [];
let editing = null;   // the post object being edited, or null on the list screen

/* ---------- auth ---------- */
const auth  = () => { try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch { return null; } };
const token = () => auth()?.access_token;
const store = (d) => localStorage.setItem(KEY, JSON.stringify(d));

async function signIn(email, password) {
  const res = await fetch(`${SB.url}/auth/v1/token?grant_type=password`, {
    method: "POST",
    headers: { apikey: SB.key, "Content-Type": "application/json" },
    body: JSON.stringify({ email, password }),
  });
  const d = await res.json();
  if (!res.ok || !d.access_token) throw new Error(d.error_description || d.msg || "Sign in failed");
  store(d);
}

async function refreshToken() {
  const a = auth();
  if (!a?.refresh_token) return false;
  const res = await fetch(`${SB.url}/auth/v1/token?grant_type=refresh_token`, {
    method: "POST",
    headers: { apikey: SB.key, "Content-Type": "application/json" },
    body: JSON.stringify({ refresh_token: a.refresh_token }),
  });
  const d = await res.json();
  if (!res.ok || !d.access_token) return false;
  store(d);
  return true;
}

/* Every authenticated call goes through here so an expired access token costs
   one silent refresh rather than an unexplained failure mid-edit. */
async function api(path, opts = {}, retry = true) {
  const res = await fetch(`${SB.url}/rest/v1/${path}`, {
    ...opts,
    headers: {
      apikey: SB.key, Authorization: `Bearer ${token()}`,
      "Content-Type": "application/json", ...(opts.headers || {}),
    },
  });
  if (res.status === 401 && retry && (await refreshToken())) return api(path, opts, false);
  if (!res.ok) throw new Error(`${res.status} — ${await res.text()}`);
  return res.status === 204 ? null : res.json();
}

/* Re-encodes every picked image through a canvas before upload. Two reasons,
   both load-bearing:

   1. PRIVACY. Phone photos carry EXIF with GPS coordinates. This bucket is
      public, so an untouched upload would publish where the picture was taken —
      usually home. A canvas re-encode carries no EXIF at all.
   2. WEIGHT. A 4 MB original is served to every reader at 980px wide.

   imageOrientation:"from-image" matters: without it a portrait phone photo
   whose rotation lives only in EXIF comes out sideways once the EXIF is gone. */
/* --8<-- image-pipeline (extracted verbatim by tools/test-image-pipeline.html) */
const MAX_EDGE = 1920;

/* JPEG has no alpha channel, so encoding a transparent PNG as JPEG flattens
   every transparent pixel to black. Illustrations on this site are cut out on
   transparency, so the format has to follow the image, not the other way
   round: WebP when there is alpha to keep, JPEG when there is not. */
function canvasHasAlpha(cv) {
  const { width: w, height: h } = cv;
  const d = cv.getContext("2d").getImageData(0, 0, w, h).data;
  const step = Math.max(1, Math.floor(Math.min(w, h) / 96));
  for (let y = 0; y < h; y += step) {
    for (let x = 0; x < w; x += step) {
      if (d[(y * w + x) * 4 + 3] < 250) return true;
    }
  }
  return false;
}

async function shrinkImage(file) {
  let bmp;
  try {
    bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
  } catch (e) {
    bmp = await new Promise((ok, no) => {
      const img = new Image();
      img.onload = () => ok(img);
      img.onerror = () => no(new Error("Could not read that image"));
      img.src = URL.createObjectURL(file);
    });
  }
  const w = bmp.width, h = bmp.height;
  const scale = Math.min(1, MAX_EDGE / Math.max(w, h));
  const cv = document.createElement("canvas");
  cv.width = Math.round(w * scale);
  cv.height = Math.round(h * scale);
  cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);

  const alpha = canvasHasAlpha(cv);
  let blob = alpha
    ? await new Promise((ok) => cv.toBlob(ok, "image/webp", 0.85))
    : await new Promise((ok) => cv.toBlob(ok, "image/jpeg", 0.82));

  // A browser that cannot write WebP returns PNG from toBlob, or null. Either
  // way the extension must describe what is actually in the blob.
  if (!blob) blob = await new Promise((ok) => cv.toBlob(ok, "image/png"));
  if (!blob) throw new Error("Could not process that image");

  const ext = { "image/webp": "webp", "image/jpeg": "jpg", "image/png": "png" }[blob.type] || "png";
  return { blob, w: cv.width, h: cv.height, was: file.size, ext, alpha };
}
/* --8<-- end */

async function uploadImage(file, base) {
  const { blob, w, h, was, ext, alpha } = await shrinkImage(file);
  const stem = slugify(base) || "image";
  const name = `${stem}-${Math.random().toString(36).slice(2, 6)}.${ext}`;
  const res = await fetch(`${SB.url}/storage/v1/object/journal/${name}`, {
    method: "POST",
    headers: { apikey: SB.key, Authorization: `Bearer ${token()}`, "Content-Type": blob.type },
    body: blob,
  });
  if (!res.ok) throw new Error(await res.text());
  const kb = (n) => `${Math.round(n / 1024)} KB`;
  lastUpload = `${w}x${h} ${ext}${alpha ? " with transparency" : ""}, ${kb(was)} to ${kb(blob.size)}`;
  return `${SB.url}/storage/v1/object/public/journal/${name}`;
}
let lastUpload = "";

async function deleteImage(url) {
  const name = String(url || "").split("/journal/").pop();
  if (!name) throw new Error("Unrecognised image URL");
  const res = await fetch(`${SB.url}/storage/v1/object/journal/${name}`, {
    method: "DELETE", headers: { apikey: SB.key, Authorization: `Bearer ${token()}` },
  });
  if (!res.ok) throw new Error(await res.text());
}

async function listImages() {
  const res = await fetch(`${SB.url}/storage/v1/object/list/journal`, {
    method: "POST",
    headers: { apikey: SB.key, Authorization: `Bearer ${token()}`, "Content-Type": "application/json" },
    body: JSON.stringify({ prefix: "", limit: 200, sortBy: { column: "created_at", order: "desc" } }),
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

const imgUrl = (name) => `${SB.url}/storage/v1/object/public/journal/${name}`;

/* Renaming moves the object AND rewrites every reference to it — cover_url,
   body_md and body_html across all posts. A rename that only moved the file
   would silently break the posts using it, which is the whole reason people
   avoid renaming images at all. */
async function renameImage(oldName, newBase) {
  const stem = slugify(newBase);
  if (!stem) throw new Error("Give it a descriptive name");
  const ext = (oldName.split(".").pop() || "jpg").toLowerCase();
  const newName = `${stem}.${ext}`;
  if (newName === oldName) return oldName;

  const res = await fetch(`${SB.url}/storage/v1/object/move`, {
    method: "POST",
    headers: { apikey: SB.key, Authorization: `Bearer ${token()}`, "Content-Type": "application/json" },
    body: JSON.stringify({ bucketId: "journal", sourceKey: oldName, destinationKey: newName }),
  });
  if (!res.ok) throw new Error(await res.text());

  const oldUrl = imgUrl(oldName), newUrl = imgUrl(newName);
  let touched = 0;
  for (const p of await api("posts?select=id,body_md,body_html,cover_url")) {
    const patch = {};
    if (p.cover_url === oldUrl) patch.cover_url = newUrl;
    if ((p.body_md || "").includes(oldUrl)) patch.body_md = p.body_md.split(oldUrl).join(newUrl);
    if ((p.body_html || "").includes(oldUrl)) patch.body_html = p.body_html.split(oldUrl).join(newUrl);
    if (Object.keys(patch).length) { await api(`posts?id=eq.${p.id}`, { method: "PATCH", body: JSON.stringify(patch) }); touched++; }
  }
  return { newName, touched };
}

/* ---------- screens ---------- */
function note(msg, bad) {
  const el = document.getElementById("note");
  if (el) el.innerHTML = `<div class="msg ${bad ? "err" : "ok"}">${escapeHtml(msg)}</div>`;
}

function screenLogin(err) {
  barActions.innerHTML = "";
  app.innerHTML = `<div class="panel" style="max-width:420px;margin:40px auto;">
    <h2 style="font-family:'Playfair Display',Georgia,serif;font-weight:500;margin:0 0 18px;">Sign in</h2>
    ${err ? `<div class="msg err">${escapeHtml(err)}</div>` : ""}
    <div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="username"></div>
    <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"></div>
    <button class="btn btn-primary" id="go">Sign in &rarr;</button></div>`;
  const submit = async () => {
    try {
      await signIn(document.getElementById("em").value.trim(), document.getElementById("pw").value);
      await screenList();
    } catch (e) { screenLogin(e.message); }
  };
  document.getElementById("go").onclick = submit;
  document.getElementById("pw").onkeydown = (e) => { if (e.key === "Enter") submit(); };
}

async function screenList() {
  editing = null;
  barActions.innerHTML = `<button class="btn btn-primary btn-sm" id="new">New post &rarr;</button>
    <button class="btn btn-ghost btn-sm" id="out">Sign out</button>`;
  document.getElementById("new").onclick = () => screenEdit(null);
  document.getElementById("out").onclick = () => { localStorage.removeItem(KEY); screenLogin(); };

  app.innerHTML = `<div id="note"></div><p class="muted">Loading posts&hellip;</p>`;
  try {
    posts = await api("posts?select=*&order=updated_at.desc");
  } catch (e) { screenLogin("Session expired — sign in again."); return; }

  app.innerHTML = `<div id="note"></div>` + (posts.length
    ? `<div class="plist">${posts.map((p, i) => `
        <div class="prow">
          <span class="pill ${p.status}">${p.status}</span>
          <span class="t"><b>${escapeHtml(p.title || "(untitled)")}</b>
            <span>${p.status === "published" ? escapeHtml(fmtDate(p.published_at)) : "draft"}
            &middot; /${escapeHtml(p.slug)}</span></span>
          <button class="btn btn-ghost btn-sm" data-edit="${i}">Edit</button>
        </div>`).join("")}</div>`
    : `<p class="muted">No posts yet. Start one with <strong>New post</strong>.</p>`);

  app.querySelectorAll("[data-edit]").forEach((b) => {
    b.onclick = () => screenEdit(posts[+b.dataset.edit]);
  });

  app.insertAdjacentHTML("beforeend", `<div id="images" style="margin-top:44px;">
    <div class="sec-head"><h2>Images</h2></div>
    <p class="muted">Loading images&hellip;</p></div>`);
  drawImages();
}

async function drawImages() {
  const host = document.getElementById("images");
  if (!host) return;
  let files = [];
  try { files = await listImages(); }
  catch (e) { host.innerHTML = `<div class="msg err">Could not list images: ${escapeHtml(e.message)}</div>`; return; }

  const kb = (n) => `${Math.round((n || 0) / 1024)} KB`;
  host.innerHTML = `<div class="sec-head"><h2>Images</h2></div>` + (files.length
    ? `<div class="igrid">${files.map((f, i) => `
        <div class="icard">
          <img src="${escapeHtml(imgUrl(f.name))}" alt="" loading="lazy">
          <div class="iname">${escapeHtml(f.name)}</div>
          <div class="imeta">${kb(f.metadata?.size)}</div>
          <div class="iacts">
            <button class="btn btn-ghost btn-sm" data-ren="${i}">Rename</button>
            <button class="btn btn-ghost btn-sm" data-del="${i}">Delete</button>
          </div>
        </div>`).join("")}</div>`
    : `<p class="muted">No images uploaded yet.</p>`);

  host.querySelectorAll("[data-ren]").forEach((b) => {
    b.onclick = async () => {
      const f = files[+b.dataset.ren];
      const base = prompt("Describe this image. It becomes the file name.\n\ne.g. shelf of echeveria in morning light",
                          f.name.replace(/-[a-z0-9]{4}\.[a-z]+$/, "").replace(/-/g, " "));
      if (!base) return;
      try {
        const { newName, touched } = await renameImage(f.name, base);
        note(`Renamed to ${newName}${touched ? ` and updated ${touched} post${touched > 1 ? "s" : ""}` : ""}.`);
        drawImages();
      } catch (e) { note(`Rename failed: ${e.message}`, true); }
    };
  });

  host.querySelectorAll("[data-del]").forEach((b) => {
    b.onclick = async () => {
      const f = files[+b.dataset.del];
      const url = imgUrl(f.name);
      const used = posts.filter((p) => p.cover_url === url || (p.body_md || "").includes(url));
      const warn = used.length
        ? `\n\nWARNING: this image is used by ${used.length} post(s):\n${used.map((p) => p.title).join("\n")}\nDeleting it will leave a broken image there.`
        : "";
      if (!confirm(`Delete ${f.name} permanently?${warn}`)) return;
      try { await deleteImage(url); note(`Deleted ${f.name}.`); drawImages(); }
      catch (e) { note(`Delete failed: ${e.message}`, true); }
    };
  });
}

function screenEdit(p) {
  editing = p ? { ...p } : { title: "", slug: "", excerpt: "", body_md: "",
                             cover_url: "", tags: [], status: "draft" };
  const isNew = !editing.id;

  barActions.innerHTML = `
    <button class="btn btn-ghost btn-sm" id="back">&larr; All posts</button>
    <button class="btn btn-ghost btn-sm" id="preview">Preview</button>
    <button class="btn btn-ghost btn-sm" id="save">Save draft</button>
    <button class="btn btn-primary btn-sm" id="pub">${editing.status === "published" ? "Update" : "Publish"} &rarr;</button>`;

  app.innerHTML = `<div id="note"></div>
    <div class="row-2">
      <div class="field"><label for="f-title">Title</label>
        <input id="f-title" value="${escapeHtml(editing.title)}"></div>
      <div class="field"><label for="f-slug">Slug</label>
        <input id="f-slug" value="${escapeHtml(editing.slug)}">
        <div class="hint">The web address: /post.html?slug=<span id="slug-echo"></span></div></div>
    </div>
    <div class="field"><label for="f-excerpt">Excerpt</label>
      <input id="f-excerpt" value="${escapeHtml(editing.excerpt || "")}">
      <div class="hint">One or two sentences, shown on the journal index.</div></div>
    <div class="row-2">
      <div class="field"><label for="f-tags">Tags</label>
        <input id="f-tags" value="${escapeHtml((editing.tags || []).join(", "))}">
        <div class="hint">Comma separated.</div></div>
      <div class="field"><label for="f-cover">Cover image</label>
        <input id="f-cover" type="file" accept="image/*">
        <div id="cover-wrap"></div></div>
    </div>
    <div class="editor-cols">
      <div class="field"><label for="f-body">Post &mdash; Markdown</label>
        <textarea id="f-body">${escapeHtml(editing.body_md || "")}</textarea>
        <div class="hint" style="margin-top:10px;">
          <label for="f-imgdesc" style="text-transform:none;letter-spacing:0;font-size:12.5px;
            color:var(--ink-faint);font-weight:400;">Describe the image, then choose it. The
            description becomes the file name and the alt text.</label>
          <input id="f-imgdesc" placeholder="shelf of echeveria in morning light"
            style="margin:6px 0;font-size:13px;">
          <input id="f-inline" type="file" accept="image/*" style="font-size:12px;"></div></div>
      <div><label style="display:block;font-size:12px;letter-spacing:.6px;text-transform:uppercase;
        font-weight:600;color:var(--ink-faint);margin-bottom:6px;">Preview</label>
        <div class="preview post-body" id="prev"></div></div>
    </div>
    ${isNew ? "" : `<p style="margin-top:26px;"><button class="btn btn-ghost btn-sm" id="del">Delete this post</button></p>`}`;

  const $ = (id) => document.getElementById(id);
  const draw = () => { $("prev").innerHTML = mdToHtml($("f-body").value); };
  const echoSlug = () => { $("slug-echo").textContent = $("f-slug").value || "…"; };

  $("f-body").addEventListener("input", draw);
  $("f-slug").addEventListener("input", echoSlug);
  // Only autofill the slug while it is untouched; renaming a live post would
  // break every link already shared.
  $("f-title").addEventListener("input", () => {
    if (isNew && !$("f-slug").dataset.touched) { $("f-slug").value = slugify($("f-title").value); echoSlug(); }
  });
  $("f-slug").addEventListener("change", () => { $("f-slug").dataset.touched = "1"; });
  draw(); echoSlug();

  const drawCover = () => {
    $("cover-wrap").innerHTML = editing.cover_url
      ? `<img class="cover-prev" src="${escapeHtml(editing.cover_url)}" alt="">
         <p style="margin:9px 0 0;"><button class="btn btn-ghost btn-sm" id="cover-rm">Remove cover</button></p>`
      : "";
    const rm = $("cover-rm");
    if (!rm) return;
    rm.onclick = async () => {
      const url = editing.cover_url;
      editing.cover_url = null;
      drawCover();
      // Clear the field first, delete the file second: a failed delete leaves
      // an orphan in the bucket, which the Images panel can mop up. A failed
      // clear would leave the post pointing at a file that is already gone.
      try { await deleteImage(url); note("Cover removed, and the file deleted. Save to keep the change."); }
      catch (err) { note(`Cover cleared, but the file remains: ${err.message}`, true); }
    };
  };
  drawCover();

  $("f-cover").onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    note("Uploading cover…");
    try {
      editing.cover_url = await uploadImage(f, `${$("f-slug").value || $("f-title").value || "post"}-cover`);
      drawCover();
      note(`Cover uploaded, EXIF stripped — ${lastUpload}.`);
    } catch (err) { note(`Cover upload failed: ${err.message}`, true); }
  };

  $("f-inline").onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    const desc = $("f-imgdesc").value.trim();
    note(desc ? "Uploading image…" : "Uploading image — add a description next time for better alt text…");
    try {
      const url = await uploadImage(f, desc || `${$("f-slug").value || "post"}-image`);
      const ta = $("f-body");
      const at = ta.selectionStart ?? ta.value.length;
      ta.value = `${ta.value.slice(0, at)}\n\n![${desc}](${url})\n\n${ta.value.slice(at)}`;
      draw(); note(`Image inserted, EXIF stripped — ${lastUpload}.`);
      e.target.value = ""; $("f-imgdesc").value = "";
    } catch (err) { note(`Image upload failed: ${err.message}`, true); }
  };

  const collect = () => {
    const body_md = $("f-body").value;
    return {
      title: $("f-title").value.trim(),
      slug: ($("f-slug").value.trim() || slugify($("f-title").value)),
      excerpt: $("f-excerpt").value.trim() || null,
      tags: $("f-tags").value.split(",").map((t) => t.trim()).filter(Boolean),
      cover_url: editing.cover_url || null,
      body_md,
      body_html: mdToHtml(body_md),
    };
  };

  const save = async (status) => {
    /* published_at and updated_at are set here rather than by a database
       trigger, so the schema stays plain DDL. The read policy requires a
       non-null published_at, so a post published without one would be
       invisible to the public. */
    const now = new Date().toISOString();
    const row = { ...collect(), status, updated_at: now };
    if (status === "published" && !editing.published_at) row.published_at = now;
    if (!row.title) { note("Give it a title first.", true); return; }
    if (!row.slug)  { note("Give it a slug first.", true); return; }
    try {
      note("Saving…");
      if (editing.id) {
        await api(`posts?id=eq.${editing.id}`, { method: "PATCH", body: JSON.stringify(row) });
      } else {
        const [created] = await api("posts", {
          method: "POST", headers: { Prefer: "return=representation" }, body: JSON.stringify(row),
        });
        editing = created;
      }
      await screenList();
      note(status === "published" ? "Published." : "Draft saved.");
    } catch (e) {
      note(/duplicate key/i.test(e.message) ? "That slug is already used by another post." : e.message, true);
    }
  };

  /* A true preview: the actual post.html, with its real stylesheet, masthead
     and measure. The draft is handed over in sessionStorage rather than being
     saved first, so what opens is exactly what is in the editor right now,
     unsaved edits included. */
  $("preview").onclick = () => {
    const p = collect();
    sessionStorage.setItem("ja_preview", JSON.stringify({
      title: p.title || "(untitled)", excerpt: p.excerpt, body_html: p.body_html,
      cover_url: p.cover_url, tags: p.tags,
      published_at: editing.published_at || new Date().toISOString(),
      status: editing.status || "draft",
    }));
    window.open("post.html?preview=1", "ja_preview_win");
  };

  $("back").onclick = () => screenList();
  $("save").onclick = () => save("draft");
  $("pub").onclick  = () => save("published");
  if ($("del")) $("del").onclick = async () => {
    if (!confirm("Delete this post permanently?")) return;
    try { await api(`posts?id=eq.${editing.id}`, { method: "DELETE" }); await screenList(); note("Deleted."); }
    catch (e) { note(e.message, true); }
  };
}

document.getElementById("build").textContent = BUILD;
(async () => { token() ? await screenList() : screenLogin(); })();
</script>

</body>
</html>
