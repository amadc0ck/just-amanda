<script src="site.js?v=2026-09-03.1"></script>
<script>
(async () => {
  const host = document.getElementById("post");
  const params = new URLSearchParams(location.search);

  const notFound = (msg) => {
    host.innerHTML = `<div class="wrap" style="padding:70px 0;text-align:center;">
      <h1 style="font-family:'Playfair Display',Georgia,serif;font-weight:500;">${escapeHtml(msg)}</h1>
      <p class="muted">It may have been unpublished, or the link may be wrong.</p>
      <p><a class="btn btn-ghost" href="journal.html">Back to the journal &rarr;</a></p></div>`;
  };

  const render = (p, preview) => {
    document.title = `${p.title} — just amanda`;
    const meta = document.querySelector('meta[name="description"]');
    if (meta && p.excerpt) meta.setAttribute("content", p.excerpt);

    const banner = preview
      ? `<div class="preview-banner">Preview &middot; ${p.status === "published"
          ? "this is how the live post looks" : "not published — only you can see this"}</div>`
      : "";
    const cover = p.cover_url ? `<img class="post-cover" src="${escapeHtml(p.cover_url)}" alt="">` : "";
    const tags = (p.tags || []).length
      ? `<div class="tags">${p.tags.map((t) => `<span class="tag is-amethyst">${escapeHtml(t)}</span>`).join("")}</div>`
      : "";
    const when = p.status === "published" || !preview ? fmtDate(p.published_at) : "Draft";

    /* body_html is rendered from Markdown at save time and written only by the
       authenticated author, so it is inserted as-is. */
    host.innerHTML = `${banner}<div class="wrap">
      <div class="post-head">
        <a class="back" href="journal.html">&larr; Journal</a>
        <span class="eyebrow">${escapeHtml(when)}</span>
        <h1>${escapeHtml(p.title)}</h1>
      </div>
      ${cover}
      <div class="post-body">${p.body_html || ""}${tags}</div>
    </div>`;
  };

  /* Preview mode: admin.html hands the live editor contents over in
     sessionStorage, so this renders unsaved work through the real page —
     same stylesheet, same measure, same masthead. Nothing is fetched. */
  if (params.get("preview") === "1") {
    let p = null;
    try { p = JSON.parse(sessionStorage.getItem("ja_preview") || "null"); } catch (e) { /* ignore */ }
    if (!p) { notFound("Nothing to preview"); return; }
    render(p, true);
    return;
  }

  const slug = params.get("slug");
  if (!slug) { notFound("No post specified"); return; }

  try {
    const rows = await sbGet(
      `posts?select=title,excerpt,body_html,cover_url,tags,published_at,status` +
      `&slug=eq.${encodeURIComponent(slug)}&status=eq.published&limit=1`);
    if (!rows.length) { notFound("Post not found"); return; }
    render(rows[0], false);
  } catch (e) {
    notFound("This post could not load");
    console.error(e);
  }
})();
</script>

</body>
