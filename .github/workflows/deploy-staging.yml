# Deploys the WordPress theme, and only the theme, to the STAGING site, over SFTP.
#
# Why not GoDaddy's gd-wordpress-deployer action (the provisioned
# godaddy-workflow.yml): it runs commands over SSH, and the staging site allows
# SFTP only. Two runs failed on 2026-11-04, first at ssh-keyscan (the provisioned
# file names the web host, whose port 22 is closed), then at SSH authentication.
# Production has SSH, but production is out of bounds until a later phase.
#
# Source and destination are fixed here; nothing a person types can change them.
# mirror --delete removes files from the theme folder that were deleted from
# wordpress/justamanda/, and touches nothing outside that folder.
#
# Secrets (added by Amanda in repo settings): STAGING_SFTP_HOST, STAGING_SFTP_USER,
# STAGING_SFTP_PASSWORD. The password reaches lftp through LFTP_PASSWORD, never on
# a command line, and nothing here prints it.
name: Deploy theme to staging

on:
  push:
    branches: [main]
    paths: ["wordpress/justamanda/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install lftp
        run: sudo apt-get update -q && sudo apt-get install -y -q lftp

      - name: Mirror wordpress/justamanda to html/wp-content/themes/justamanda
        env:
          SFTP_HOST: ${{ secrets.STAGING_SFTP_HOST }}
          SFTP_USER: ${{ secrets.STAGING_SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.STAGING_SFTP_PASSWORD }}
        run: |
          set -euo pipefail
          # Staging only: refuse any host that is not this site's.
          case "$SFTP_HOST" in *1311999*) ;; *) echo "::error::STAGING_SFTP_HOST is not the staging site"; exit 1;; esac
          lftp -c "
            set cmd:fail-exit yes;
            set net:max-retries 2;
            set net:timeout 30;
            set sftp:connect-program 'ssh -a -x -o StrictHostKeyChecking=accept-new';
            open --env-password -u \"$SFTP_USER\" \"sftp://$SFTP_HOST\";
            cd html/wp-content/themes/justamanda;
            lcd wordpress/justamanda;
            mirror --reverse --delete --verbose=1 --parallel=4 --exclude-glob .DS_Store . .;
            bye
          "

      - name: Check the deployed stylesheet is the one just pushed
        run: |
          set -euo pipefail
          want=$(grep -m1 '^Version:' wordpress/justamanda/style.css)
          got=$(curl -fsS "https://1311999.us21.myftpupload.com/wp-content/themes/justamanda/style.css?nocache=$GITHUB_RUN_ID" | grep -m1 '^Version:' || true)
          echo "repo: $want / staging: ${got:-not readable}"
          if [ -n "$got" ] && [ "$got" != "$want" ]; then
            echo "::warning::staging serves a different theme version (cache, or the web address is not this site)"
          fi
