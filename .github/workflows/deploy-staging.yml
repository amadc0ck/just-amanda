# Deploys the WordPress theme, and only the theme, to the STAGING site.
#
# Built from GoDaddy's provisioned godaddy-workflow.yml (untracked, never run):
# same action, same deploy user, same PRIVATE_KEY secret. Changed from it:
#   - The host is the site's SSH host (.ssh.). The provisioned file names the web
#     host, whose port 22 is closed; the first run on 2026-11-04 died there.
#   - Source and destination are fixed below. There are no workflow inputs, so
#     nothing typed at "Run workflow" can point it at the WordPress root.
#   - cleanup_deleted_files removes files deleted from wordpress/justamanda/. The
#     action computes that list with an rsync --delete dry run against the
#     destination folder only, so nothing outside the theme folder is touched.
#
# Pinned to @v1, not a commit SHA: the action checks out its companion repo
# (godaddy-wordpress/git-deploy-poc) at the ref name it was called with, so a SHA
# here would make that checkout fail.
#
# The action runs GoDaddy's health check after deploying and rolls back if
# WordPress stops answering.
name: Deploy theme to staging

on:
  push:
    branches: [main]
    paths: ["wordpress/justamanda/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Deploy wordpress/justamanda to wp-content/themes/justamanda (staging)
        uses: godaddy-wordpress/gd-wordpress-deployer@v1
        with:
          remote_host: "1311999.us21.ssh.myftpupload.com"
          ssh_user: "git_deployer_e0299d279c_1311999"
          ssh_private_key: ${{ secrets.PRIVATE_KEY }}
          source_path: "wordpress/justamanda"
          deployment_dest: "wp-content/themes/justamanda"
          cleanup_deleted_files: "yes"

      - name: Check the deployed stylesheet is the one just pushed
        run: |
          set -euo pipefail
          want=$(grep -m1 '^Version:' wordpress/justamanda/style.css)
          got=$(curl -fsS "https://1311999.us21.myftpupload.com/wp-content/themes/justamanda/style.css?nocache=$GITHUB_RUN_ID" | grep -m1 '^Version:' || true)
          echo "repo: $want / staging: ${got:-not readable}"
          if [ -n "$got" ] && [ "$got" != "$want" ]; then
            echo "::warning::staging serves a different theme version (cache, or the web address is not this site)"
          fi
